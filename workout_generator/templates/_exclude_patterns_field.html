<details class="exclude-patterns">
  <summary>Exclude movement patterns (optional)</summary>
  <p class="hint">Bench a pattern for this week -- e.g. a sore shoulder -&gt; exclude Vertical Push. When a
    pattern is unavoidable for a block with no substitute, it may still show up; you'll get a warning if so.</p>
  <div class="checkbox-grid">
    {% for p in pattern_options %}
    <label><input type="checkbox" name="exclude_patterns" value="{{ p.key }}"> {{ p.label }}</label>
    {% endfor %}
  </div>
</details>
