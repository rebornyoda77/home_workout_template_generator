# Example nginx reverse-proxy config for the workout generator's web
# interface. Sits between Tailscale and the app's own Werkzeug dev
# server (which isn't meant to be exposed directly) -- see docs/user_guide.md's
# "Running the web interface on a server" section for the full setup.
#
# Install (adjust the port below if you're already using 8050 for something
# else -- e.g. run each self-hosted tool's nginx block on its own port,
# 8050/8051/8052/..., and point Tailscale `serve` at whichever one matches):
#   sudo cp deploy/nginx-home-workout.conf /etc/nginx/sites-available/home-workout
#   sudo ln -s /etc/nginx/sites-available/home-workout /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # Only on localhost -- nothing here is reachable off this machine
    # directly. `tailscale serve` (see the user guide) is what actually
    # exposes this, over HTTPS, to the rest of your tailnet.
    listen 127.0.0.1:8050;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
